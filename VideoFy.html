<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Videofy — lightweight vertical video feed</title>
    <style>
        :root{--bg:#0b0b0f;--accent:#ff2d55;--muted:#9aa0a6}
        html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
        /* vertical feed */
        .feed{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
        .card{position:relative;height:100vh;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;background:#000}
        video{width:100%;height:100%;object-fit:cover}
        /* overlays */
        .meta{position:absolute;left:16px;bottom:36px;z-index:3;max-width:65%}
        .title{font-weight:600;margin:0 0 8px;font-size:18px}
        .author{color:var(--muted);font-size:13px;margin:0}
        .actions{position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:3}
        .btn{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(4px)}
        .btn .count{display:block;font-size:12px;margin-top:6px;color:var(--muted);text-align:center}
        .logo{position:absolute;left:12px;top:12px;padding:8px 12px;border-radius:12px;background:linear-gradient(90deg,#ff7a6c,#ff2d55);font-weight:700}
        /* like animation */
        .like-burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;z-index:4}
        .like-burst svg{width:160px;height:160px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.6))}
        .burst-animate{animation:burst .6s forwards}
        @keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}60%{transform:translate(-50%,-50%) scale(1.05)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
        /* small helper overlay for instructions */
        .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;background:rgba(0,0,0,0.45);padding:6px 12px;border-radius:999px;color:var(--muted);font-size:13px}
    </style>
</head>
<body>
    <div class="logo">Videofy</div>

    <div class="feed" id="feed">
        <!-- Card 1 -->
        <section class="card">
            <video muted playsinline loop preload="metadata" poster="">
                <source src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
            </video>
            <div class="meta">
                <div class="title">Big Buck Bunny — Demo clip</div>
                <div class="author">@videofy_creator</div>
            </div>
            <div class="actions">
                <div class="btn like" title="Like">
                    ❤️
                    <span class="count">1.2K</span>
                </div>
                <div class="btn" title="Comments">💬<span class="count">324</span></div>
                <div class="btn" title="Share">🔗<span class="count">Share</span></div>
            </div>
            <div class="like-burst" aria-hidden="true">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(60 60)">
                        <path d="M0-22c-7.7-14-34-18.7-34 4.8 0 9 8.6 17 17 23 8.6 6 24 14 34 26 10-12 25-20 34-26 8.3-6 17-14 17-23 0-23.5-26.3-18.8-34-4.8z" fill="url(#g)"/>
                        <defs>
                            <linearGradient id="g" x1="0" x2="1">
                                <stop offset="0" stop-color="#ff7a6c"/>
                                <stop offset="1" stop-color="#ff2d55"/>
                            </linearGradient>
                        </defs>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Card 2 -->
        <section class="card">
            <video muted playsinline loop preload="metadata">
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
            </video>
            <div class="meta">
                <div class="title">Flower — Calm scenery</div>
                <div class="author">@naturelover</div>
            </div>
            <div class="actions">
                <div class="btn like" title="Like">❤️<span class="count">8.9K</span></div>
                <div class="btn" title="Comments">💬<span class="count">1.1K</span></div>
                <div class="btn" title="Share">🔗<span class="count">Share</span></div>
            </div>
            <div class="like-burst" aria-hidden="true">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><g transform="translate(60 60)"><path d="M0-22c-7.7-14-34-18.7-34 4.8 0 9 8.6 17 17 23 8.6 6 24 14 34 26 10-12 25-20 34-26 8.3-6 17-14 17-23 0-23.5-26.3-18.8-34-4.8z" fill="url(#g2)"/><defs><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#4361ee"/></linearGradient></defs></g></svg>
            </div>
        </section>

        <!-- Card 3 -->
        <section class="card">
            <video muted playsinline loop preload="metadata">
                <source src="https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" type="video/mp4">
            </video>
            <div class="meta">
                <div class="title">Elephant's Dream — Art demo</div>
                <div class="author">@artstudio</div>
            </div>
            <div class="actions">
                <div class="btn like" title="Like">❤️<span class="count">640</span></div>
                <div class="btn" title="Comments">💬<span class="count">98</span></div>
                <div class="btn" title="Share">🔗<span class="count">Share</span></div>
            </div>
            <div class="like-burst" aria-hidden="true">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><g transform="translate(60 60)"><path d="M0-22c-7.7-14-34-18.7-34 4.8 0 9 8.6 17 17 23 8.6 6 24 14 34 26 10-12 25-20 34-26 8.3-6 17-14 17-23 0-23.5-26.3-18.8-34-4.8z" fill="#ffcc00"/></g></svg>
            </div>
        </section>
    </div>

    <div class="hint">Scroll or use ↑ ↓ | Double-click video to like</div>

    <script>
        // Autoplay only the most visible video using IntersectionObserver
        const cards = Array.from(document.querySelectorAll('.card'));
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (!video) return;
                if (entry.intersectionRatio > 0.55) {
                    // play active
                    video.play().catch(()=>{/* autoplay might be blocked in some browsers */});
                } else {
                    video.pause();
                }
            });
        }, {threshold: [0,0.25,0.55,0.75,1]});

        cards.forEach(c=>observer.observe(c));

        // Double click to like with animation; increment count display locally
        document.querySelectorAll('.card').forEach(card=>{
            const video = card.querySelector('video');
            const likeBtn = card.querySelector('.btn.like');
            const burst = card.querySelector('.like-burst');

            let liked = false;

            function triggerLike() {
                liked = !liked;
                // update small count text (naive numeric parsing)
                const span = likeBtn.querySelector('.count');
                let val = span.textContent.replace(/\D/g,'');
                val = val ? Number(val) : 0;
                span.textContent = liked ? formatCount(val + 1) : formatCount(Math.max(0,val - 1));
                // burst animation
                burst.classList.remove('burst-animate');
                // reflow to restart animation
                void burst.offsetWidth;
                burst.classList.add('burst-animate');
            }

            video.addEventListener('dblclick', triggerLike);
            likeBtn.addEventListener('click', triggerLike);
        });

        function formatCount(n){
            if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
            if (n >= 1000) return (n/1000).toFixed(1)+'K';
            return String(n);
        }

        // keyboard navigation: arrow keys jumps to next/prev card
        const feed = document.getElementById('feed');
        window.addEventListener('keydown', e=>{
            if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                e.preventDefault();
                scrollToCard(1);
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault();
                scrollToCard(-1);
            }
        });

        function scrollToCard(direction){
            const visibleIndex = cards.findIndex(c => c.getBoundingClientRect().top >= -10 && c.getBoundingClientRect().top < window.innerHeight/2);
            let target = 0;
            if (visibleIndex === -1) {
                // fallback: find midmost
                const middle = window.scrollY + window.innerHeight/2;
                target = cards.findIndex(c=>c.offsetTop >= middle);
                if (target < 0) target = 0;
            } else {
                target = Math.min(Math.max(0, visibleIndex + direction), cards.length-1);
            }
            cards[target].scrollIntoView({behavior:'smooth',block:'center'});
        }

        // small UX: when page loads, play the first visible video
        window.addEventListener('load', ()=> {
            const first = cards[0].querySelector('video');
            first && first.play().catch(()=>{});
        });
    </script>
</body>
</html>
